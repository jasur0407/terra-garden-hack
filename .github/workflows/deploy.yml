name: Fetch stats and deploy

on:
  schedule:
    - cron: '17 3 * * *' 
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch Hackatime stats
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          HACKATIME_USER: ${{ vars.HACKATIME_USER }}
        run: node scripts/fetch-stats.mjs

      - name: Commit snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "terra-garden[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "No data changes"; else
            git commit -m "chore: daily stats snapshot $(date -u +%F)"
            git push
          fi

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
