<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2b1d14" />
  <meta name="description" content="Terra Garden: a pixel-art farm that grows from your real coding time on Hackatime." />
  <title>Terra Garden</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="farm" aria-label="A pixel-art plot with one sprout"></canvas>
  <h1 class="title">Terra Garden</h1>

  <main id="readout" class="card">
    <h2 id="ro-name"></h2>
    <p class="big"><span id="ro-hours">0</span> hours coded</p>
    <ul id="ro-projects"></ul>
    <p id="ro-empty" hidden>No stats yet. Run <code>npm run fetch</code> and reload.</p>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
